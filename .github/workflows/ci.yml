name: babel
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m babel validate --root .
      - run: python3 -m babel discover --root . > pages/ecosystem.json
